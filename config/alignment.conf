# ==========================================================================
#  ALICE ITS2 ML Alignment -- single configuration file
# ==========================================================================
#  Every setting the run needs lives here. Edit by hand, with
#  `config/alignctl.sh set KEY=VALUE`, or through the ROOT GUI
#  (`config/alignctl.sh ui`).
#
#  This file is sourced by bash, so the syntax is KEY="value" with no
#  spaces around the equals sign. Anything else here is a comment.
#
#  After editing, run `config/alignctl.sh generate` to push the values that
#  live inside ROOT macros and module headers, then `config/alignctl.sh
#  doctor` to check the paths actually exist.
# ==========================================================================


# ---------------------------------------------------------------- data ---

# Directory holding the reconstructed track files. Read by the data-prep
# macro through the generated DataSetConfig.h.
DATA_INPUT_DIR="/run/media/root/Storage1/Data/2023pp/alignment-input/LHC23zt_Standard/20240405_aligned_v20240129+CERN+ITSR+5.0um+DZ+AI6+AI3_O2_20240229_inputs"

# Glob the GUI uses when listing candidate files in DATA_INPUT_DIR.
DATA_FILE_PATTERN="alignment-input-data*.root"

# The files training may draw from, whitespace separated. Files present in
# DATA_INPUT_DIR but absent here are ignored -- that is how verification
# samples are held back.
DATA_FILES="alignment-input-data_run00539884_0630_2_useDCA.root
            alignment-input-data_run00539884_0630_3_useDCA.root
            alignment-input-data_run00539884_0630_4_useDCA.root
            alignment-input-data_run00539884_0630_5_useDCA.root
            alignment-input-data_run00539884_0630_6_useDCA.root
            alignment-input-data_run00539884_0630_7_useDCA.root
            alignment-input-data_run00539884_0630_8_useDCA.root
            alignment-input-data_run00539884_0630_9_useDCA.root
            alignment-input-data_run00539884_0630_10_useDCA.root"

# How many of DATA_FILES are shuffled together into one batch.
DATA_FILES_PER_BATCH="5"

# Upper bound passed to the merge; the effective count is the smaller of
# this and DATA_FILES_PER_BATCH.
DATA_MERGE_MAX_FILES="20"


# -------------------------------------------------------------- module ---

# Which frozen source tree to unpack, without the .tgz suffix. The archive
# is expected at MODULE/${MODULE_NAME}.tgz.
MODULE_NAME="v20250627+a_vtx.useAPR.hitCluster.useDCA.ver4_core.v20251024"

# Track schema of the input tree, which differs between module generations:
# the 2025 tree carries a per-track `charge` field and the 2024 tree does not.
# It must match the module named above -- `alignctl.sh doctor` reads the
# archive and checks. Accepted values: 2024, 2025.
TRACK_SCHEMA="2025"

# Written into each worker's YMLPParallel.h after the module is unpacked,
# which is the only way to set these without rebuilding the archive.
MODULE_EVENTS="50000"      # nDATA   -- events used per worker
MODULE_EPOCHS="5"          # nEPOCH  -- epochs per step
MODULE_JPARALLEL="0"       # jparallel
MODULE_CORES="1"           # nCORE   -- cores per worker


# ------------------------------------------------------------ schedule ---

# Step number of the reference archive in PARAMS/. A run continues the
# global numbering from here.
BASE_STEP="900"

# Steps each worker trains before the workers are merged. 1 means every
# step is merged; higher values let workers drift further apart first.
STEPS_PER_BATCH="1"

# Batches in the run. Total steps trained is N_BATCHES * STEPS_PER_BATCH,
# so the run ends at step BASE_STEP + that product.
N_BATCHES="10"

# Parallel workers, and equally the number of slices one batch is cut into.
N_WORKERS="8"

# Batch ID handed to DataSplit.
BATCH_ID="0"


# ----------------------------------------------------------- environment ---

# O2 installation loaded with alienv.
O2_DIR="/home/alice/Software/v20230501"

# Data-prep macro directory. Leave empty to use RUN/MasterDataScript.
MASTER_DATA_SCRIPT_DIR=""

# Seconds between worker launches, to stagger ROOT startup.
WORKER_LAUNCH_STAGGER="15"

# Default run tag when runAll_alignment.sh is called without an argument.
RUN_TAG=""
